name: Build macOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build app and installer ZIP
        working-directory: MAC
        run: |
          chmod +x build_app.sh package_release.sh install.sh uninstall.sh
          ./build_app.sh
          ./package_release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: TrollControl-mac
          path: MAC/dist/TrollControl-mac.zip

      - name: Attach ZIP to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: MAC/dist/TrollControl-mac.zip
